<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <div class="cal">
            <form>
                <div class="entry">
                    <input placeholder="0">
                </div>
                <div class="btns">
                    <div >
                        <button class="first">AC</button>
                        <button class="first">+/-</button>
                        <button class="first">%</button>
                        <button class="op">/</button>
                    </div>
                    <div>
                        <button onclick="appendToEntry('7')">7</button>
                        <button>8</button>
                        <button>9</button>
                        <button class="op">*</button>
                    </div>
                    <div>
                        <button>4</button>
                        <button>5</button>
                        <button>6</button>
                        <button class="op">-</button>
                    </div>
                    <div>
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                        <button class="op">+</button>
                    </div>
                    <div>
                        <button>
                            <img src="icons/recent-repeat-icon.svg" height="12">
                        </button>
                        <button>0</button>
                        <button>.</button>
                        <button class="op">=</button>
                    </div>

                </div>
                
            
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
